version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_ir
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_ir
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    depends_on:
      - db
      - redis

volumes:
  db_data:
  redis_data:

version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_ir
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_ir
    restart: always
    volumes:
      - redis_data:/data

  backend:
    restart: always
    volumes: []
    depends_on:
      - db
      - redis

  batch:
    restart: always

  frontend:
    restart: always
    volumes: []

volumes:
  db_data:
  redis_data:
